<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: 'Segoe UI Variable', 'Segoe UI', system-ui, -apple-system, sans-serif;
        background: #f5f5f5;
        color: #242424;
      }
      main {
        max-width: 320px;
        padding: 24px;
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 600;
      }
      button {
        font: inherit;
        font-weight: 600;
        min-height: 44px;
        padding: 8px 20px;
        border: 0;
        border-radius: 4px;
        /* The default --accent of global.css: this page opens without the app, its config and its theme. */
        background: #0f548c;
        color: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sign in</h1>
      <p id="message" role="status">Continue to sign in with your Microsoft work account.</p>
      <button id="continue" type="button">Continue</button>
    </main>
    <script type="module" src="/src/infrastructure/auth/pages/popupRelay.ts"></script>
  </body>
</html>
