<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Returning to the organization chart...</title>
    <!-- Inline: hidden frames load this page for every silent sign-in, which should not wait for a stylesheet. -->
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: 'Segoe UI Variable', 'Segoe UI', system-ui, -apple-system, sans-serif;
        background: #f5f5f5;
        color: #242424;
      }
      main {
        max-width: 320px;
        padding: 24px;
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 600;
      }
      p {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <!-- Sign-ins and sign-outs both come back through this page, so the heading names neither. -->
      <h1>Returning to the organization chart...</h1>
      <!-- Empty until the redirect bridge fails; present from the start so screen readers announce the text. -->
      <p id="status" role="alert"></p>
    </main>
    <script type="module" src="/src/infrastructure/auth/pages/redirectBridge.ts"></script>
  </body>
</html>
