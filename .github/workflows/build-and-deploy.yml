# Builds and tests the site, packages the Teams and SharePoint apps and deploys main to the Azure Static Web App, as azure-pipelines.yml does.
name: Build and deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - docs/**
      - azure-pipelines.yml
  pull_request:
    branches: [main]
  workflow_dispatch:

# One run per branch at a time: on main a newer push waits and replaces older waiting ones, so an older build never deploys last.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: '24'
  # The SharePoint Framework runs on Node.js 22 alone (sharepoint/package.json).
  SHAREPOINT_NODE_VERSION: '22'

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    env:
      # The site's host name. Without it a run builds and tests only, as in a fork that deploys nowhere.
      SITE_HOST: ${{ vars.SITE_HOST }}
      # Pull requests can come from forks, so only runs of main keep what they build.
      PUBLISH: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sharepoint/package-lock.json

      # The build needs no install scripts, and keytar's would fetch or compile a native module.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The build doesn't run ESLint, which also enforces the layer rules.
      - name: Lint
        run: npm run lint

      # The github-actions reporter marks each failing test on the commit or the pull request.
      - name: Test
        run: npm test -- --reporter=default --reporter=github-actions

      - name: Type-check and build
        run: npm run build
        env:
          # Settings > About this chart shows 1.0.<run number>, the version the app packages get below (vite.config.ts).
          ORGAPP_BUILD_ID: ${{ github.run_number }}

      - name: Publish the site
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist
          if-no-files-found: error

      - name: Say why the apps are not packaged
        if: env.SITE_HOST == ''
        run: |
          echo "::notice::The variable SITE_HOST is not set, so this run builds and tests only. Set it under Settings > Secrets and variables > Actions to package the Teams and SharePoint apps and deploy main."

      # Teams only accepts a package as an update when its version is higher, so the run number is the patch number.
      - name: Number the app packages
        id: version
        if: env.SITE_HOST != ''
        run: |
          echo "version=$(node -p "require('./package.json').version.replace(/[^.]*$/, process.env.GITHUB_RUN_NUMBER)")" >> "$GITHUB_OUTPUT"

      - name: Package the Teams app
        if: env.SITE_HOST != ''
        env:
          # The developer name that Teams shows for the app; the script's own default stands in where it is not set.
          TEAMS_DEVELOPER: ${{ vars.TEAMS_DEVELOPER }}
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          options=(--host "$SITE_HOST" --version "$PACKAGE_VERSION")
          if [ -n "$TEAMS_DEVELOPER" ]; then options+=(--developer "$TEAMS_DEVELOPER"); fi
          npm run package:teams -- "${options[@]}"

      - name: Use Node.js ${{ env.SHAREPOINT_NODE_VERSION }} for the SharePoint Framework
        if: env.SITE_HOST != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.SHAREPOINT_NODE_VERSION }}

      - name: Install the SharePoint Framework
        if: env.SITE_HOST != ''
        working-directory: sharepoint
        run: npm ci --ignore-scripts

      - name: Package the SharePoint app
        if: env.SITE_HOST != ''
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: npm run package:sharepoint -- --host "$SITE_HOST" --version "$PACKAGE_VERSION"

      - name: Publish the Teams app package
        if: env.SITE_HOST != '' && env.PUBLISH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: teams-app
          path: teams/build
          if-no-files-found: error

      - name: Publish the SharePoint app package
        if: env.SITE_HOST != '' && env.PUBLISH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sharepoint-app
          path: sharepoint/solution/organization-chart.sppkg
          if-no-files-found: error

  deploy:
    name: Deploy
    needs: build
    # Pushes to main and manual runs of it; pull requests build and test only.
    if: github.ref == 'refs/heads/main' && vars.SITE_HOST != ''
    runs-on: ubuntu-latest
    # Created on the first run. Settings > Environments can require an approval before each deploy.
    environment:
      name: production
      url: ${{ steps.settings.outputs.url }}
    steps:
      - name: Check the deployment settings
        id: settings
        env:
          DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          SITE_HOST: ${{ vars.SITE_HOST }}
        run: |
          if [ -z "$DEPLOYMENT_TOKEN" ]; then
            echo "::error::The secret AZURE_STATIC_WEB_APPS_API_TOKEN is not set. Add the Static Web App's deployment token under Settings > Secrets and variables > Actions."
            exit 1
          fi
          # The host name alone, as the Teams package takes it from an address too.
          host="${SITE_HOST#*://}"
          host="${host%%/*}"
          echo "url=https://$host/" >> "$GITHUB_OUTPUT"

      - name: Download the site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site

      # The head of the v1 branch, which @v1 runs; the v1 tag is an older commit of 2021.
      - name: Deploy the site
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: site
          output_location: ''
          skip_app_build: true
          skip_api_build: true

      # A wrong SITE_HOST would go unnoticed until the Teams app opens another site, or none.
      - name: Check that SITE_HOST serves this build
        env:
          SITE_URL: ${{ steps.settings.outputs.url }}
        run: |
          live="$RUNNER_TEMP/live.html"
          # A new deployment can take a moment to reach the address.
          for _ in {1..18}; do
            if curl --fail --silent --max-time 20 --output "$live" "${SITE_URL}index.html" && cmp --silent "$live" site/index.html; then
              echo "$SITE_URL serves this build."
              exit 0
            fi
            sleep 10
          done
          echo "::warning::The site is deployed, but $SITE_URL does not serve this build. Check that the variable SITE_HOST is this Static Web App's host name: the Teams app opens that address."
